<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>말씀암송</title>
  <meta name="description" content="온누리교회 일대일 제자양육 성경암송구절">
  <meta name="theme-color" content="#1b2a4a">
  <!-- 홈 화면 설치(앱처럼 실행)용 설정 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="말씀암송">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ① 목록 화면 -->
  <section id="listScreen" class="screen">
    <header class="list-header">
      <div>
        <h1>말씀암송</h1>
        <p class="subtitle">일대일 제자양육 암송구절</p>
      </div>
      <button id="themeBtn" class="icon-btn" aria-label="화면 밝기 바꾸기">🌙</button>
    </header>
    <input id="searchInput" class="search" type="search" placeholder="🔍 성경 이름·주제로 찾기 (예: 요한, 기도)">
    <main id="verseList"></main>
    <footer class="list-footer">
      성경 본문: 개역개정 ⓒ 대한성서공회 · 개인 암송용
    </footer>
  </section>

  <!-- ② 말씀 표시 화면 (전체 화면) -->
  <section id="viewScreen" class="screen hidden" aria-live="polite">
    <div id="stage" class="stage">
      <div id="lines" class="lines"></div>
      <div id="refLabel" class="ref-label"></div>
    </div>

    <!-- 위쪽 조작줄 -->
    <div id="topBar" class="bar top-bar">
      <button id="closeBtn" class="icon-btn" aria-label="목록으로">✕</button>
      <div id="viewTitle" class="view-title"></div>
      <button id="editBtn" class="icon-btn small-text" aria-label="구절 편집">편집</button>
    </div>

    <!-- 아래쪽 조작줄 -->
    <div id="bottomBar" class="bar bottom-bar">
      <div class="row">
        <div class="segmented" role="group" aria-label="표시 방식">
          <button data-mode="static">정지</button>
          <button data-mode="lyric">가사</button>
          <button data-mode="hint">가리기</button>
        </div>
      </div>
      <div class="row speed-row" id="speedRow">
        <span class="label">속도</span>
        <button id="slowerBtn" class="icon-btn" aria-label="느리게">−</button>
        <input id="speedRange" type="range" min="0" max="6" step="1" aria-label="속도">
        <button id="fasterBtn" class="icon-btn" aria-label="빠르게">+</button>
        <span id="speedLabel" class="speed-label">1x</span>
      </div>
      <div class="row">
        <button id="prevBtn" class="icon-btn" aria-label="이전 구절">⏮</button>
        <button id="restartBtn" class="icon-btn" aria-label="처음부터">↺</button>
        <button id="playBtn" class="play-btn" aria-label="재생">▶</button>
        <button id="repeatBtn" class="icon-btn" aria-label="반복 재생">🔁</button>
        <button id="nextBtn" class="icon-btn" aria-label="다음 구절">⏭</button>
      </div>
      <div class="row">
        <button id="fontDownBtn" class="icon-btn small-text" aria-label="글자 작게">가−</button>
        <button id="fontUpBtn" class="icon-btn small-text" aria-label="글자 크게">가+</button>
        <button id="viewThemeBtn" class="icon-btn" aria-label="화면 밝기 바꾸기">🌙</button>
        <button id="fullBtn" class="icon-btn" aria-label="전체 화면">⛶</button>
      </div>
    </div>
    <div id="tapHint" class="tap-hint">화면을 터치하면 조작 버튼이 나타납니다</div>
  </section>

  <!-- ③ 구절 편집 창 -->
  <dialog id="editDialog">
    <form method="dialog" class="edit-form">
      <h2>구절 편집</h2>
      <label>주제 <input id="editTopic" type="text"></label>
      <label>성경 위치 <input id="editRef" type="text" placeholder="예: 요한복음 3:16"></label>
      <label>본문 <small>(줄 바꿈 위치에 엔터)</small>
        <textarea id="editText" rows="9"></textarea>
      </label>
      <p class="edit-note">수정 내용은 이 휴대폰에만 저장됩니다.</p>
      <div class="edit-actions">
        <button type="button" id="resetVerseBtn" class="ghost">원래대로</button>
        <button value="cancel" class="ghost">취소</button>
        <button type="button" id="saveVerseBtn" class="primary">저장</button>
      </div>
    </form>
  </dialog>

  <script src="js/verses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
